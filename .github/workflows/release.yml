name: Release
on:
  release:
    types: [published]
jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name }}
      source: src/VolumeMixerPlugin
      changelog: ${{ github.event.release.body }}
      # The workflow's default "newest prerelease" resolves to 3.0.0-beta.11, which the Store
      # refuses as older than its minimum. Pinned to the minimum it publishes.
      cli-version: 3.0.0-beta.16